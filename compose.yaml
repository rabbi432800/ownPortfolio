services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "127.0.0.1:8012:8000"
    restart: unless-stopped
    volumes:
      - portfolio-data:/app/backend/data
      - portfolio-uploads:/app/frontend/assets/uploads

volumes:
  portfolio-data:
  portfolio-uploads:
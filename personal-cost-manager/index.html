<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#080d16">
    <title>Personal Cost Manager</title>
    <style>
      :root {
        color-scheme: dark;
        font: 15px/1.6 Arial, Helvetica, sans-serif;
        color: #edf4fb;
        background: #080d16;
      }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; place-items: center; margin: 0; padding: 24px; }
      main { width: min(520px, 100%); border: 1px solid rgba(160,184,212,.18); border-radius: 18px; padding: clamp(24px, 6vw, 42px); background: #101a29; box-shadow: 0 24px 70px rgba(0,0,0,.28); }
      a { display: inline-flex; min-height: 40px; align-items: center; border: 1px solid rgba(160,184,212,.2); border-radius: 9px; padding: 9px 13px; color: #edf4fb; text-decoration: none; }
      a:hover { border-color: rgba(88,214,232,.5); color: #58d6e8; }
      .eyebrow { margin: 22px 0 8px; color: #58d6e8; font-size: 10px; font-weight: 800; letter-spacing: .16em; }
      h1 { margin: 0; font-size: clamp(27px, 6vw, 38px); line-height: 1.2; }
      p:last-child { margin: 12px 0 0; color: #9aa9bb; }
    </style>
  </head>
  <body>
    <main>
      <a href="/myterminal">← Return to admin panel</a>
      <p class="eyebrow">PROJECT DASHBOARD</p>
      <h1>Personal Cost Manager</h1>
      <p>The project dashboard will appear here when its app files are added to this folder.</p>
    </main>
  </body>
</html>
